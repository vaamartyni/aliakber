<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="telegram" content="webapp" />
  <!-- Подключаем скрипт Telegram WebApp API перед любыми другими скриптами -->
  <script src="https://telegram.org/js/telegram-web-app.js?57"></script>
  <title>Telegram WebApp Test</title>
</head>
<body style="font-family: sans-serif; padding: 2rem;">
  <h1>Тест Telegram WebApp</h1>
  <pre id="output">Загрузка...</pre>

  <script>
    (function () {
      const output = document.getElementById('output');
      // Получаем объект Telegram WebApp
      const tg = window.Telegram && window.Telegram.WebApp;
      
      if (!tg) {
        output.textContent = "Telegram WebApp API недоступен (не открыт из Telegram?)";
        return;
      }
      
      // Инициализируем API (сообщаем Telegram, что Web App готов)
      tg.ready();
      
      // Извлекаем данные, переданные Telegram
      const data = tg.initDataUnsafe;
      if (!data || !data.first_name) {
        output.textContent = "initDataUnsafe пустой или Telegram не передал данные.";
        return;
      }
      
      // Выводим полученные данные в формате JSON
      output.textContent = JSON.stringify(data, null, 2);
    })();
  </script>
</body>
</html>
