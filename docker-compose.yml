version: '3.8'

services:
  aliakber:
    image: nginx:stable
    container_name: aliakber
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - internal
    restart: unless-stopped

networks:
  internal:
    external: true